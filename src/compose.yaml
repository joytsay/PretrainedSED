services:
  webui-build:
    image: node:22-bookworm-slim
    restart: "no"
    working_dir: /workspace/src/webui
    environment:
      npm_config_cache: /tmp/npm-cache
    volumes:
      - ..:/workspace
    command:
      - sh
      - -lc
      - |
        set -eu
        npm ci
        npm run build
        owner="$$(stat -c '%u:%g' package.json)"
        chown -R "$${owner}" node_modules .svelte-kit dist

  sed:
    image: ${PSED_IMAGE:-psed:latest}
    container_name: ${PSED_CONTAINER_NAME:-psed}
    depends_on:
      webui-build:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    runtime: nvidia
    ipc: host
    working_dir: /workspace
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "${PSED_PORT:-8080}:8080"
    volumes:
      - ..:/workspace
    command:
      - bash
      - -lc
      - |
        export LD_LIBRARY_PATH="/usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu/tegra:$${LD_LIBRARY_PATH:-}"
        exec /workspace/build-agx/atst_sed_web_testbed \
          --worker /workspace/build-agx/atst_sed_worker \
          --engine /workspace/resources/ATST-F_strong_1.trt \
          --mapping /workspace/class_mapping.csv \
          --labels /workspace/resources/ATST-F_strong_1.labels.txt \
          --web-root /workspace/src/webui/dist \
          --videos-root /workspace/videos \
          --host 0.0.0.0 \
          --port 8080

  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      sed:
        condition: service_started
    restart: unless-stopped
    ports:
      - "${PSED_HTTPS_PORT:-8443}:443"
    environment:
      PSED_HTTPS_HOST: ${PSED_HTTPS_HOST:-192.168.0.80}
      PSED_AUDIO_UPSTREAM: ${PSED_AUDIO_UPSTREAM:-voice-ai:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Adapted from audio.cpp AGX Compose for STT and TTS only.
  voice-ai:
    profiles: [audio]
    image: psed-audiocpp-agx:local
    container_name: ${PSED_AUDIO_CONTAINER_NAME:-psed-audiocpp}
    build:
      context: ../docker/audiocpp
      dockerfile: Dockerfile
      target: full
      args:
        BASE_CUDA_CONTAINER: ${AUDIOCPP_BASE_IMAGE:-nvcr.io/nvidia/l4t-jetpack:r36.4.0}
        GCC_VERSION: ${GCC_VERSION:-11}
        CUDA_DOCKER_ARCH: ${CUDA_ARCH:-87-real}
        AUDIOCPP_MODEL_SET: custom
        AUDIOCPP_MODELS: parakeet_tdt,pocket_tts
        AUDIOCPP_CPU_ALL_VARIANTS: "OFF"
        BUILD_JOBS: ${BUILD_JOBS:-1}
    runtime: nvidia
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "${PSED_AUDIO_PORT:-8091}:8081"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        /app/audiocpp_model_manager install parakeet_tdt_q8_0 --models-dir /app/models
        /app/audiocpp_model_manager install pocket_tts_english_q8_0 --models-dir /app/models
        /app/audiocpp_model_manager install pocket_tts_french_q8_0 --models-dir /app/models
        exec /app/audiocpp_server --config /app/sed-server.json
    volumes:
      - audio-models:/app/models
      - audio-voices:/app/voices
      - ../docker/audiocpp/server.json:/app/sed-server.json:ro
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8081/health]
      interval: 20s
      timeout: 5s
      retries: 6
      # The initial start downloads the STT and two language-specific TTS packages before serving requests.
      start_period: 30m

volumes:
  audio-models:
  audio-voices:
  caddy-data:
  caddy-config:
